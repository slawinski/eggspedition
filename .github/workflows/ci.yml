name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verify
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: eggspedition_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verify -d eggspedition_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_TEST_DATABASE_URL: postgres://verify:verify@localhost:5432/eggspedition_verify
    steps:
      - name: Check out the PR revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node for Vitest
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up deployed Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Install frozen dependencies
        run: bun install --no-env-file --frozen-lockfile
      - name: Verify tests, types, build, icons, and production passkeys
        run: bun --no-env-file run verify
