<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e"/>
      <stop offset="100%" stop-color="#a18cd1"/>
    </linearGradient>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dx="0" dy="0"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="white" flood-opacity="0.4"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded rect background (FAB style) -->
  <rect x="40" y="40" width="432" height="432" rx="100" ry="100"
        fill="url(#fabGrad)" filter="url(#innerGlow)"/>

  <!-- Subtle border -->
  <rect x="40" y="40" width="432" height="432" rx="100" ry="100"
        fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>

  <!-- Egg emoji perfectly centered -->
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
        font-size="250" font-family="system-ui, -apple-system, sans-serif">🥚</text>
</svg>
