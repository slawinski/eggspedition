<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="egg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="60%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#e8d5b7"/>
    </linearGradient>
    <linearGradient id="yolk" x1="30%" y1="30%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <radialGradient id="shine" cx="35%" cy="30%" r="35%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="#e7f3ec"/>

  <!-- Egg body -->
  <ellipse cx="256" cy="240" rx="110" ry="140" fill="url(#egg)"/>

  <!-- Egg highlight/shine -->
  <ellipse cx="220" cy="195" rx="50" ry="60" fill="url(#shine)"/>

  <!-- Subtle contour -->
  <ellipse cx="256" cy="240" rx="108" ry="138" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>
</svg>
